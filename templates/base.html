<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gestion Étudiants{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="{{ url_for('dashboard') }}" class="navbar-brand">Gestion</a>
      <ul class="nav-links">
        <li><a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Accueil</a></li>
        <li><a href="{{ url_for('lister') }}" class="{% if request.endpoint == 'lister' %}active{% endif %}">Étudiants</a></li>
        <li><a href="{{ url_for('ajouter') }}" class="{% if request.endpoint == 'ajouter' %}active{% endif %}">Ajouter</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
