{% extends "base.html" %}
{% block title %}Ajouter{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Ajouter un étudiant</h1>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="form-row">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" name="nom" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" name="prenom" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Âge</label>
          <input type="number" name="age" class="form-control" min="16" max="99" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Filière</label>
          <input type="text" name="filiere" class="form-control" required>
        </div>
        <div class="form-group">
          <label>N° Étudiant</label>
          <input type="text" name="numero_etudiant" class="form-control" required>
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a href="{{ url_for('lister') }}" class="btn btn-outline">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
